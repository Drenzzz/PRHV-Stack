# One command: docker compose up --build
# App reads secrets from .env (BETTER_AUTH_SECRET, APP_ENCRYPTION_KEY, ...).
services:
  app:
    build: .
    ports:
      - "4224:4114"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-lunite}
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_URL: http://localhost:4224
      PORT: 4114
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: ["bun", "src/worker/index.ts"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-lunite}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-lunite}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "5385:6379"

volumes:
  pgdata:
